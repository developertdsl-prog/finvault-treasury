version: '3.8'

services:
  mongodb:
    image: mongo:7.0-jammy
    container_name: finvault-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - finvault_mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: finvault_treasury
    networks:
      - finvault-net

  redis:
    image: redis:7.2-alpine
    container_name: finvault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - finvault_redis_data:/data
    networks:
      - finvault-net

  finvault-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finvault-treasury-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/finvault_treasury
      - REDIS_URL=redis://redis:6379
      - BASE_CURRENCY=USD
      - LOG_LEVEL=info
    depends_on:
      - mongodb
      - redis
    networks:
      - finvault-net

volumes:
  finvault_mongo_data:
  finvault_redis_data:

networks:
  finvault-net:
    driver: bridge
